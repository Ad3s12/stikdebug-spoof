name: Build StikDebugSpoof

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation \
            -o StikDebugSpoof.dylib StikDebugSpoof.m
      - name: Ad-hoc sign
        run: |
          codesign -f -s - StikDebugSpoof.dylib
          codesign -dv StikDebugSpoof.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: StikDebugSpoof
          path: StikDebugSpoof.dylib
